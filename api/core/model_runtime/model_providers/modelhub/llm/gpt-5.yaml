model: gpt-5
label:
  zh_Hans: gpt-5
  en_US: gpt-5
model_type: llm
features:
  - multi-tool-call
  - agent-thought
  - stream-tool-call
model_properties:
  mode: chat
  context_size: 400000
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
  - name: presence_penalty
    use_template: presence_penalty
  - name: frequency_penalty
    use_template: frequency_penalty
  - name: max_tokens
    use_template: max_tokens
    default: 2048
    min: 1
    max: 128000
  - name: response_format
    use_template: response_format
pricing:
  input: "1.25"
  output: "10"
  unit: "0.000001"
  currency: USD
